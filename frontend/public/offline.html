<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#163B50">
    <title>رحلة التغيير — بلا اتصال</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f7fbfa; color: #132f3d; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; }
      main { width: min(440px, 100%); border: 1px solid #dce9e7; border-radius: 16px; background: #fff; padding: 32px 24px; box-shadow: 0 14px 34px -5px rgba(22, 59, 80, .08); }
      img { width: 84px; height: 84px; object-fit: contain; }
      h1 { margin: 16px 0 8px; font-size: 24px; }
      p { margin: 0; color: #617780; line-height: 1.8; }
      button { min-height: 44px; margin-top: 22px; border: 0; border-radius: 10px; background: #163b50; color: #fff; padding: 0 18px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/journey-mark.png" alt="">
      <h1>رحلة التغيير غير متصلة</h1>
      <p>احتفظنا بما تم على هذا الجهاز. عند عودة الاتصال، أعد المحاولة للعودة إلى رحلتك.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
